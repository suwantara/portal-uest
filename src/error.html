<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · Portal UEST</title>
		<style>
			:root {
				color-scheme: light;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			body {
				display: grid;
				min-height: 100vh;
				margin: 0;
				place-items: center;
				background: #f8fafc;
				color: #0f172a;
				padding: 24px;
			}
			main {
				width: min(100%, 460px);
				border: 1px solid #e2e8f0;
				border-radius: 24px;
				background: #fff;
				padding: 40px 32px;
				text-align: center;
				box-shadow: 0 18px 45px -24px rgb(15 23 42 / 0.25);
			}
			.mark {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 48px;
				height: 48px;
				border-radius: 14px;
				background: #4f46e5;
				color: #fff;
				font-weight: 700;
				font-size: 20px;
			}
			.status {
				margin: 24px 0 4px;
				color: #6366f1;
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.2em;
				text-transform: uppercase;
			}
			h1 {
				margin: 0;
				font-size: 24px;
				letter-spacing: -0.02em;
			}
			p {
				margin: 12px 0 0;
				color: #64748b;
				font-size: 14px;
				line-height: 1.6;
			}
			a {
				display: inline-flex;
				margin-top: 28px;
				border-radius: 12px;
				background: #4f46e5;
				color: #fff;
				font-size: 14px;
				font-weight: 600;
				padding: 11px 18px;
				text-decoration: none;
			}
			a:hover {
				background: #4338ca;
			}
			.brand {
				margin-top: 28px;
				color: #94a3b8;
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="mark">U</div>
			<div class="status">%sveltekit.status%</div>
			<h1>Terjadi kesalahan</h1>
			<p>%sveltekit.error.message%</p>
			<a href="/">Kembali ke beranda</a>
			<p class="brand">Portal UEST · Workspace internal tim</p>
		</main>
	</body>
</html>
