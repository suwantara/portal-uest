services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Dokploy/Traefik mengakses container lewat network internal.
    # Untuk akses langsung dari host saat development, tambahkan sementara:
    # ports:
    #   - '3000:3000'
    expose:
      - '3000'
    volumes:
      # Only needed when STORAGE_DRIVER=local. With R2 the volume can be removed.
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  uploads:
